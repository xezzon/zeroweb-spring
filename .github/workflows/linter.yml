# SonarCloud：编译仓库内全部 Maven 模块后执行代码质量与安全分析。

name: SonarCloud

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

env:
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '25'

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Compile Maven modules
        run: |
          set -e
          for module in zeroweb-proto zeroweb-open-sdk zeroweb-spring-boot-starter; do
            mvn -B clean install -D skipTests=true -T 1C -f "${module}/pom.xml"
          done
          mvn -B clean package -D skipTests=true -T 1C -f zeroweb-service/pom.xml
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.exclusions=**/target/**,**/src/test/**,site/**,javaagent/**
            -Dsonar.test.inclusions=**/src/test/**
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.java.test.binaries=**/target/test-classes
