zeroweb:
  id-generator: ${ZEROWEB_ID_GENERATOR:UUID}

spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connectionTimeout: 30000
      idleTimeout: 600000
      maxLifetime: 1800000
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.default_batch_fetch_size]": 1000  # 处理 N+1 问题
  grpc:
    server:
      servlet:
        enabled: false
    client:
      channels:
        admin:
          address: zeroweb-service-admin:10002
        file:
          address: zeroweb-service-file:10022
  threads:
    virtual:
      enabled: true

logging:
  level:
    root: info
    "[io.github.xezzon]": debug

sa-token:
  is-read-cookie: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  show-actuator: true
  use-management-port: true
