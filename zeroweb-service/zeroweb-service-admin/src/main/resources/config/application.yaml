spring:
  application:
    name: @project.artifactId@
    group: @project.groupId@
    version: @project.version@
  profiles:
    include:
      - common
      - ${JDBC_TYPE:postgresql}
      - ${CACHE_TYPE:in-memory}
      - ${SPRING_ENVIRONMENT:prod}
  liquibase:
    tag: @project.version@
  grpc:
    server:
      port: @grpc.port@

server:
  port: @http.port@

management:
  server:
    port: @management.port@

sa-token:
  token-name: X-SESSION-ID
  token-style: tik
  timeout: ${SA_TOKEN_TIMEOUT:2592000}

zeroweb:
  root-password: ${ZEROWEB_ROOT_PASSWORD}
  jwt:
    issuer: ${ZEROWEB_JWT_ISSUER:xezzon.github.io}
    timeout: ${ZEROWEB_JWT_TIMEOUT:120}
