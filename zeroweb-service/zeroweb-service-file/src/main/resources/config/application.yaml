spring:
  application:
    name: @project.artifactId@
    group: @project.groupId@
    version: @project.version@
  profiles:
    include:
      - common
      - ${JDBC_TYPE:postgresql}
      - ${CACHE_TYPE:in-memory}
      - ${SPRING_ENVIRONMENT:prod}
  liquibase:
    tag: @project.version@
  servlet:
    multipart:
      max-file-size: ${zeroweb.file.max-size:1}MB

server:
  port: @app.port@

zeroweb:
  file:
    provider: ${ZEROWEB_FILE_PROVIDER:FS}
    max-part-size: ${ZEROWEB_FILE_MAX_PART_SIZE:1}
